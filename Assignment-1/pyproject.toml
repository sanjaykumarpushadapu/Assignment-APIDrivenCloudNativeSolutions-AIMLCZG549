[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-risk-prediction"
version = "0.1.0"
description = "Platform-neutral data pipeline skeleton for diabetes risk screening."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]
# Person 4: install with `pip install -e ".[gcp]"` once gcp_service.py's
# skeleton functions are implemented against real Cloud Composer /
# Airflow REST API / Cloud Monitoring calls. Not required for local
# development or for the dataset/model endpoints (local_service.py).
gcp = [
  "google-auth>=2.34,<3",
  "google-cloud-orchestration-airflow>=1.14,<2",
  "google-cloud-monitoring>=2.22,<3",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]