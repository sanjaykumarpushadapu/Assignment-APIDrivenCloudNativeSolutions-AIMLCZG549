[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-risk-prediction"
version = "0.1.0"
description = "Platform-neutral data pipeline skeleton for diabetes risk screening."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]
# Install with `pip install -e ".[gcp]"` when using the GCP-backed API,
# Cloud Composer, Cloud Storage, or Cloud Monitoring integrations. Local
# pipeline development does not require this optional dependency group.
gcp = [
  "google-auth>=2.34,<3",
  "google-cloud-orchestration-airflow>=1.14,<2",
  "google-cloud-monitoring>=2.22,<3",
  "google-cloud-storage>=2.18,<3",
  "requests>=2.32,<3",
  "truststore>=0.10,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]