[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-care-support-assistant"
version = "0.1.0"
description = "Staff-facing NLP prototype for diabetes clinic support requests"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black>=25,<27",
    "httpx>=0.27,<1",
    "playwright>=1.55,<2",
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests requiring a running application and installed browser"]
pythonpath = ["backend/src"]
testpaths = ["backend/tests", "tests/e2e"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"demo_video/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["diabetes_support"]